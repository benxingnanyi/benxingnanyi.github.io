<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
<meta name="description" content="{{ site.description }}">
<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
<link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">
</head>
<body>
<header class="site-header">
  <nav class="nav glass">
    <a class="brand" href="{{ '/' | relative_url }}">{{ site.title }}</a>
    <span class="nav-links">
      <a href="{{ '/tech/' | relative_url }}">技术</a>
      <a href="{{ '/notes/' | relative_url }}">学习笔记</a>
      <a href="{{ '/photography/' | relative_url }}">摄影</a>
      <a href="{{ '/about/' | relative_url }}">关于</a>
    </span>
  </nav>
</header>
<main class="page glass">
{{ content }}
</main>
<footer class="site-footer">
  <p>© {{ 'now' | date: "%Y" }} {{ site.title }} · {{ site.description }}</p>
</footer>
</body>
</html>
